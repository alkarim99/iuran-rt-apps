name: Deploy

on:
  push:
    branches: [master, feat/ui-redesign]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger BE Deploy
        run: |
          send_telegram() {
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="$1" \
              -d parse_mode="HTML" > /dev/null
          }

          BRANCH=${{ github.ref_name }}
          NOW=$(date "+%Y-%m-%d %H:%M:%S")
          send_telegram "🚀 iuran-rt-apps update (${BRANCH}), memicu deploy...%0A🕐 ${NOW}"

          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.CROSS_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/alkarim99/api-iuran-rt/dispatches" \
            -d "{\"event_type\":\"deploy-fe\",\"client_payload\":{\"branch\":\"${BRANCH}\"}}"

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ iuran-rt-apps gagal memicu deploy%0A🕐 $(date "+%Y-%m-%d %H:%M:%S")" \
            > /dev/null
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
